name: Build Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          unzip -o "vapemace-client-1.21.11-ultra-human (1).zip" -d extracted
          find extracted -name build.gradle -print

      - name: Build project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name build.gradle | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Could not find build.gradle"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: built-jar
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
